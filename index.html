<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Intel Terminal | Global Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #050505; --card: #111111; --border: #222222;
            --text: #ffffff; --dim: #888888; --accent: #3d7eff;
        }
        * { box-sizing: border-box; }
        body { 
            background-color: var(--bg); color: var(--text); 
            font-family: 'Space Grotesk', sans-serif; margin: 0; padding: 20px;
        }
        /* Tidy Grid Layout */
        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(12, 1fr);
            grid-auto-rows: minmax(300px, auto);
            gap: 15px;
            max-width: 1600px;
            margin: 0 auto;
        }
        .card { 
            background: var(--card); border: 1px solid var(--border); 
            border-radius: 4px; padding: 15px; display: flex; flex-direction: column;
        }
        .card-header { 
            font-size: 11px; font-weight: 700; color: var(--dim); 
            text-transform: uppercase; letter-spacing: 2px; margin-bottom: 12px;
            border-left: 2px solid var(--accent); padding-left: 8px;
        }
        /* Card Sizes */
        .span-8 { grid-column: span 8; }
        .span-4 { grid-column: span 4; }
        .span-6 { grid-column: span 6; }
        .span-12 { grid-column: span 12; }
        .tall { grid-row: span 2; }

        .widget-container { flex-grow: 1; width: 100%; height: 100%; overflow: hidden; }
        iframe { border: none; width: 100%; height: 100%; border-radius: 2px; }

        /* Mobile Optimization */
        @media (max-width: 1024px) {
            .span-8, .span-4, .span-6 { grid-column: span 12; }
        }
    </style>
</head>
<body>

    <div class="dashboard-grid">

        <div class="card span-8 tall">
            <div class="card-header">Geopolitical Market Heatmap</div>
            <div class="widget-container">
                <div class="tradingview-widget-container">
                    <div class="tradingview-widget-container__widget"></div>
                    <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-stock-heatmap.js" async>
                    {
                      "exchanges": [], "dataSource": "WorldEquity", "grouping": "sector", "blockSize": "market_cap_basic",
                      "blockColor": "change", "locale": "en", "symbolUrl": "", "colorTheme": "dark",
                      "hasTopBar": false, "isTransparent": true, "hasSymbolTooltip": true, "width": "100%", "height": "100%"
                    }
                    </script>
                </div>
            </div>
        </div>

        <div class="card span-4">
            <div class="card-header">Real-time Earthquakes (USGS)</div>
            <div class="widget-container">
                <iframe src="https://earthquake.usgs.gov/earthquakes/map/?extent=-65.51296,-159.96094&extent=74.11419,178.94531&list=false&settings=false"></iframe>
            </div>
        </div>

        <div class="card span-4">
            <div class="card-header">IDR Exchange Rates</div>
            <div class="widget-container">
                <div class="tradingview-widget-container">
                    <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-forex-cross-rates.js" async>
                    {
                      "width": "100%", "height": "100%", "currencies": ["USD","SGD","GBP","EUR","JPY","CHF"],
                      "isTransparent": true, "colorTheme": "dark", "locale": "en", "indexWithSymbol": "FX_IDC:USDIDR"
                    }
                    </script>
                </div>
            </div>
        </div>

        <div class="card span-6 tall">
            <div class="card-header">IHSG (Indonesia) Market Chart</div>
            <div id="ihsg_chart" class="widget-container"></div>
        </div>

        <div class="card span-6 tall">
            <div class="card-header">Global Market (S&P 500)</div>
            <div id="global_chart" class="widget-container"></div>
        </div>

        <div class="card span-4">
            <div class="card-header">Commodities (Simple)</div>
            <div class="widget-container">
                <div class="tradingview-widget-container">
                    <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-market-quotes.js" async>
                    {
                      "symbolsGroups": [
                        { "name": "Metals & Energy", "symbols": [
                            {"name": "TVC:GOLD", "displayName": "Gold"},
                            {"name": "TVC:SILVER", "displayName": "Silver"},
                            {"name": "TVC:USOIL", "displayName": "Crude Oil"},
                            {"name": "TVC:UKOIL", "displayName": "Brent Oil"}
                        ]}
                      ], "colorTheme": "dark", "isTransparent": true, "width": "100%", "height": "100%"
                    }
                    </script>
                </div>
            </div>
        </div>

        <div class="card span-8">
            <div class="card-header">Global Intelligence News Feed</div>
            <div class="widget-container">
                <div class="tradingview-widget-container">
                    <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-timeline.js" async>
                    {
                      "feedMode": "all_symbols", "colorTheme": "dark", "isTransparent": true, "displayMode": "regular",
                      "width": "100%", "height": "100%"
                    }
                    </script>
                </div>
            </div>
        </div>

        <div class="card span-12" style="min-height: 150px;">
            <div class="card-header">Weather Conditions</div>
            <div style="display: flex; gap: 20px; flex-wrap: wrap;">
                <a class="weatherwidget-io" href="https://weatherwidget.io/w/0/jakarta/jakarta-indonesia/" data-label_1="JAKARTA" data-theme="pure" >JAKARTA</a>
                <a class="weatherwidget-io" href="https://weatherwidget.io/w/0/london/london-uk/" data-label_1="LONDON" data-theme="pure" >LONDON</a>
                <a class="weatherwidget-io" href="https://weatherwidget.io/w/0/new-york/new-york-ny-usa/" data-label_1="NEW YORK" data-theme="pure" >NEW YORK</a>
                <script>!function(d,s,id){var js,fjs=d.getElementsByTagName(s)[0];if(!d.getElementById(id)){js=d.createElement(s);js.id=id;js.src='https://weatherwidget.io/js/widget.min.js';fjs.parentNode.insertBefore(js,fjs);}}(document,'script','weatherwidget-io-js');</script>
            </div>
        </div>

    </div>

    <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
    <script type="text/javascript">
      new TradingView.widget({
        "container_id": "ihsg_chart", "autosize": true, "symbol": "IDX:COMPOSITE", "interval": "D",
        "timezone": "Asia/Jakarta", "theme": "dark", "style": "1", "locale": "en", "hide_top_toolbar": true, "save_image": false
      });
      new TradingView.widget({
        "container_id": "global_chart", "autosize": true, "symbol": "SPY", "interval": "D",
        "timezone": "Etc/UTC", "theme": "dark", "style": "1", "locale": "en", "hide_top_toolbar": true, "save_image": false
      });
    </script>
</body>
</html>
