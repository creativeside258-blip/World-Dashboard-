<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>World Dashboard | elbowroomx</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0a0a0a; --card: #141414; --border: #262626;
            --text: #ffffff; --dim: #a0a0a0; --accent: #ffffff;
        }
        * { box-sizing: border-box; }
        body { 
            background-color: var(--bg); color: var(--text); 
            font-family: 'Space Grotesk', sans-serif; margin: 0; padding: 20px;
        }
        
        /* Header Title */
        .title { 
            font-size: 14px; font-weight: 700; text-transform: lowercase; 
            letter-spacing: 1px; margin-bottom: 30px; color: var(--dim);
        }

        /* Tidy Grid Layout */
        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(12, 1fr);
            grid-auto-rows: minmax(180px, auto);
            gap: 15px;
            max-width: 1800px; margin: 0 auto;
        }

        .card { 
            background: var(--card); border: 1px solid var(--border); 
            border-radius: 4px; padding: 15px; display: flex; flex-direction: column;
            overflow: hidden;
        }
        .card-header { 
            font-size: 11px; font-weight: 700; color: var(--dim); 
            text-transform: uppercase; letter-spacing: 2px; margin-bottom: 12px;
        }

        /* Sizing */
        .span-8 { grid-column: span 8; }
        .span-4 { grid-column: span 4; }
        .span-3 { grid-column: span 3; }
        .span-6 { grid-column: span 6; }
        .tall { grid-row: span 3; }
        .mid { grid-row: span 2; }

        .widget-container { flex-grow: 1; width: 100%; height: 100%; }
        iframe { border: none; width: 100%; height: 100%; }

        @media (max-width: 1024px) { .span-8, .span-4, .span-6, .span-3 { grid-column: span 12; } }
    </style>
</head>
<body>

    <div class="title">world-dashboard concept by elbowroomx</div>

    <div class="dashboard-grid">

        <div class="card span-8 tall">
            <div class="card-header">Interactive Market Terminal (Search for IHSG, BMRI, etc.)</div>
            <div id="flexible_chart" class="widget-container"></div>
        </div>

        <div class="card span-4 mid">
            <div class="card-header">IDR Exchange Rates (Real-Time)</div>
            <div class="widget-container">
                <div class="tradingview-widget-container">
                    <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-market-quotes.js" async>
                    {
                      "symbolsGroups": [{
                        "name": "Rates",
                        "symbols": [
                          {"name": "FX_IDC:USDIDR", "displayName": "1 USD / IDR"},
                          {"name": "FX_IDC:SGDIDR", "displayName": "1 SGD / IDR"},
                          {"name": "FX_IDC:GBPIDR", "displayName": "1 GBP / IDR"},
                          {"name": "FX_IDC:EURIDR", "displayName": "1 EUR / IDR"},
                          {"name": "FX_IDC:JPYIDR", "displayName": "1 JPY / IDR"},
                          {"name": "FX_IDC:CHFIDR", "displayName": "1 CHF / IDR"}
                        ]
                      }],
                      "colorTheme": "dark", "isTransparent": true, "width": "100%", "height": "100%"
                    }
                    </script>
                </div>
            </div>
        </div>

        <div class="card span-4 mid">
            <div class="card-header">Real-Time Earthquakes (Worldwide)</div>
            <div class="widget-container">
                <iframe src="https://www.arcgis.com/apps/Viewer/index.html?appid=fbaa87419a6a42ff9fe102acaf3e2830"></iframe>
            </div>
        </div>

        <div class="card span-8 mid">
            <div class="card-header">Latest Global Intel News</div>
            <div class="widget-container">
                <div class="tradingview-widget-container">
                    <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-timeline.js" async>
                    {
                      "feedMode": "all_symbols", "colorTheme": "dark", "isTransparent": true,
                      "displayMode": "regular", "width": "100%", "height": "100%"
                    }
                    </script>
                </div>
            </div>
        </div>

        <div class="card span-4">
            <div class="card-header">Commodities Spot Prices</div>
            <div class="widget-container">
                <div class="tradingview-widget-container">
                    <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-market-quotes.js" async>
                    {
                      "symbolsGroups": [{
                        "name": "Energy & Metals",
                        "symbols": [
                          {"name": "TVC:GOLD", "displayName": "Gold"},
                          {"name": "TVC:SILVER", "displayName": "Silver"},
                          {"name": "TVC:USOIL", "displayName": "WTI Crude Oil"}
                        ]
                      }],
                      "colorTheme": "dark", "isTransparent": true, "width": "100%", "height": "100%"
                    }
                    </script>
                </div>
            </div>
        </div>

        <div class="card span-12">
            <div class="card-header">Weather Conditions (Major Hubs)</div>
            <div style="display: flex; gap: 15px; flex-wrap: wrap;">
                <a class="weatherwidget-io" href="https://weatherwidget.io/w/0/jakarta/jakarta-indonesia/" data-label_1="JAKARTA" data-theme="pure" >JAKARTA</a>
                <a class="weatherwidget-io" href="https://weatherwidget.io/w/0/london/london-uk/" data-label_1="LONDON" data-theme="pure" >LONDON</a>
                <a class="weatherwidget-io" href="https://weatherwidget.io/w/0/new-york/new-york-ny-usa/" data-label_1="NEW YORK" data-theme="pure" >NEW YORK</a>
                <script>!function(d,s,id){var js,fjs=d.getElementsByTagName(s)[0];if(!d.getElementById(id)){js=d.createElement(s);js.id=id;js.src='https://weatherwidget.io/js/widget.min.js';fjs.parentNode.insertBefore(js,fjs);}}(document,'script','weatherwidget-io-js');</script>
            </div>
        </div>

    </div>

    <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
    <script type="text/javascript">
      // This is the "Advanced" widget. It has the search bar in the top-left!
      new TradingView.widget({
        "container_id": "flexible_chart",
        "autosize": true,
        "symbol": "IDX:COMPOSITE",
        "interval": "D",
        "timezone": "Asia/Jakarta",
        "theme": "dark",
        "style": "1",
        "locale": "en",
        "toolbar_bg": "#f1f3f6",
        "enable_publishing": false,
        "withdateranges": true,
        "hide_side_toolbar": false,
        "allow_symbol_change": true, // THIS ENABLES FLEXIBILITY
        "save_image": false,
        "details": true,
        "hotlist": true
      });
    </script>
</body>
</html>
