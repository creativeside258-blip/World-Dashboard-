<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Intelligence Dashboard</title>
    <style>
        body { background-color: #0d1117; color: #c9d1d9; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; margin: 0; padding: 10px; }
        .grid-container { display: grid; grid-template-columns: repeat(auto-fit, minmax(350px, 1fr)); gap: 15px; max-width: 1400px; margin: 0 auto; }
        .card { background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 10px; overflow: hidden; height: 450px; }
        .card-header { font-size: 14px; font-weight: bold; margin-bottom: 10px; color: #58a6ff; text-transform: uppercase; border-bottom: 1px solid #30363d; padding-bottom: 5px; }
        .ticker { margin-bottom: 15px; }
        iframe { border: none; width: 100%; height: 100%; }
    </style>
</head>
<body>

    <div class="ticker">
        <div class="tradingview-widget-container">
            <div class="tradingview-widget-container__widget"></div>
            <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-ticker-tape.js" async>
            {
            "symbols": [
                {"proName": "FOREXCOM:SPXUSD", "title": "S&P 500"},
                {"proName": "IDX:COMPOSITE", "title": "IHSG (Indonesia)"},
                {"proName": "TVC:GOLD", "title": "Gold"},
                {"proName": "TVC:SILVER", "title": "Silver"},
                {"proName": "TVC:USOIL", "title": "Crude Oil"},
                {"description": "USD/IDR", "proName": "FX_IDC:USDIDR"}
            ],
            "showSymbolLogo": true, "colorTheme": "dark", "isTransparent": true, "displayMode": "adaptive", "locale": "en"
            }
            </script>
        </div>
    </div>

    <div class="grid-container">
        <div class="card">
            <div class="card-header">World News & Geopolitics</div>
            <div class="tradingview-widget-container">
                <div class="tradingview-widget-container__widget"></div>
                <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-timeline.js" async>
                {
                "feedMode": "all_symbols", "colorTheme": "dark", "isTransparent": true, "displayMode": "regular", "width": "100%", "height": "100%", "locale": "en"
                }
                </script>
            </div>
        </div>

        <div class="card">
            <div class="card-header">Indonesia Market (IDX)</div>
            <div class="tradingview-widget-container">
                <div class="tradingview-widget-container__widget"></div>
                <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-market-quotes.js" async>
                {
                "symbolsGroups": [
                    { "name": "Indonesia", "symbols": [
                        {"name": "IDX:COMPOSITE", "displayName": "IHSG"},
                        {"name": "IDX:BBCA", "displayName": "BCA"},
                        {"name": "IDX:TLKM", "displayName": "Telkom"},
                        {"name": "IDX:ASII", "displayName": "Astra"}
                    ]}
                ], "colorTheme": "dark", "isTransparent": true, "width": "100%", "height": "100%", "locale": "en"
                }
                </script>
            </div>
        </div>

        <div class="card" style="grid-column: span 1; height: 450px;">
            <div class="card-header">Real-time Earthquakes (USGS Data)</div>
            <iframe src="https://earthquake.usgs.gov/earthquakes/map/?extent=-38.27269,-26.71875&extent=77.5421,213.75&list=false"></iframe>
        </div>

        <div class="card">
            <div class="card-header">Commodities Analysis</div>
            <div class="tradingview-widget-container">
                <div class="tradingview-widget-container__widget"></div>
                <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-technical-analysis.js" async>
                {
                "interval": "1D", "width": "100%", "isTransparent": true, "height": "100%", "symbol": "TVC:GOLD", "showIntervalTabs": true, "locale": "en", "colorTheme": "dark"
                }
                </script>
            </div>
        </div>
    </div>

</body>
</html>
